[project]
name = "event-management-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abid", email = "abidroid1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
]

[project.scripts]
event-management-app = "event_management_app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
